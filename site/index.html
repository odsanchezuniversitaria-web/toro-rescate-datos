<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050c1d">
<meta name="description" content="Construye la base de datos de la academia TORO: tablas, claves, normalización y consultas mediante ocho niveles interactivos. PC, celular y WebXR.">
<title>TORO · Construye la academia</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23050c1d'/%3E%3Cpath d='M12 15h40v10H37v27H27V25H12z' fill='%234ceff2'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050c1d;color:#edf7ff;font-family:Arial,sans-serif}body{display:grid;place-items:center;overscroll-behavior:none;padding-bottom:48px}
#unity-canvas{display:block;width:min(100vw,calc((100vh - 48px)*1.7777778));height:min(calc(100vh - 48px),56.25vw);outline:0;background:#050c1d;touch-action:none}
#game-viewport{min-width:0;min-height:0;width:100%;height:100%;display:grid;place-items:center;overflow:auto;overscroll-behavior:contain}
#readability{display:none}
@media(pointer:coarse){#readability{display:block}body.reading #game-viewport{display:block;place-items:start}body.reading #unity-canvas{width:min(calc((100vw - 76px)*1.6),284.44445vh);height:min(160vh,calc((100vw - 76px)*.9));max-width:none;pointer-events:none;touch-action:pan-x pan-y}body.reading #game-viewport{touch-action:pan-x pan-y}}
#loading,.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 65%,#10213d,#050c1d 65%);z-index:4;text-align:center;padding:24px}
#loading h1{font-size:clamp(64px,12vw,130px);letter-spacing:.14em;margin:0;padding-left:.14em}#loading h2{font-size:clamp(16px,3vw,26px);letter-spacing:.18em;color:#4ceff2;margin:8px 0 42px}
.track{width:min(400px,75vw);height:4px;background:#183345}.fill{height:100%;width:0;background:#4ceff2;box-shadow:0 0 20px #4ceff2;transition:width .2s}#status{margin:24px 30px;max-width:700px;font-size:14px;letter-spacing:.06em;color:#9fb5cb}
button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #ffb053;outline-offset:3px}button:disabled{cursor:default;opacity:.55}
#web-tools{position:fixed;right:max(8px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));display:flex;gap:6px;z-index:2}#web-tools button{background:#0a172cee;color:#4ceff2;border:1px solid #315066;padding:8px 10px;min-height:38px;font-size:11px;border-radius:4px}#web-tools button:hover{background:#193554}
#rotate{display:none;z-index:5}.overlay h2{font-size:28px;color:#4ceff2;margin-bottom:8px}.overlay p{max-width:520px;line-height:1.6;color:#bacbdc}.primary{background:#4ceff2;color:#031522;border:0;padding:14px 24px;font-weight:bold;margin-top:16px;border-radius:4px}
#vr-help{display:none;background:#030918ed;z-index:6}#vr-help .card{max-width:620px;border:1px solid #4ceff2;background:#0b172d;padding:28px;text-align:left}#vr-help h2{margin-top:0}#vr-message{white-space:pre-line}#vr-close{width:100%}
@media(pointer:coarse){body{padding-right:76px;padding-bottom:0}#unity-canvas{width:min(calc(100vw - 76px),177.77778vh);height:min(100vh,calc((100vw - 76px)*.5625))}#web-tools{flex-direction:column;right:max(4px,env(safe-area-inset-right));bottom:8px}#web-tools button{padding:7px 5px;width:64px;min-height:44px;font-size:10px}#fullscreen span{display:none}}
@media(pointer:coarse) and (orientation:portrait){body.ready #rotate{display:flex}}
@media(prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>
<div id="game-viewport"><canvas id="unity-canvas" tabindex="0" aria-label="TORO Construye la academia. Selecciona piezas y destinos, prueba tu construcción y consulta el plano y SQL."></canvas></div>
<div id="loading" role="status"><h1>TORO</h1><h2>CONSTRUYE LA ACADEMIA</h2><div class="track"><div class="fill" id="fill"></div></div><p id="status">PREPARANDO EL LABORATORIO…</p></div>
<nav id="web-tools" aria-label="Opciones del navegador"><button id="readability" aria-pressed="false" title="Ampliar para leer; desliza para recorrer la pantalla">AMPLIAR</button><button id="enter-vr" disabled>VR · CARGANDO</button><button id="fullscreen" title="Pantalla completa" aria-label="Pantalla completa">⛶ <span>PANTALLA COMPLETA</span></button><button id="help" aria-label="Ayuda de controles">AYUDA</button></nav>
<div id="rotate" class="overlay"><div style="font-size:64px;color:#4ceff2">↻</div><h2>Gira tu celular</h2><p>Construye en horizontal para ver las piezas, los destinos y el resultado de tus acciones.</p><button class="primary" id="rotate-fullscreen">PANTALLA COMPLETA</button></div>
<div id="vr-help" class="overlay" role="dialog" aria-modal="true" aria-labelledby="help-title"><div class="card"><h2 id="help-title">CONTROLES TORO</h2><p id="vr-message"></p><button class="primary" id="vr-close">ENTENDIDO</button></div></div>
<script>
const canvas=document.getElementById('unity-canvas'),status=document.getElementById('status'),vrButton=document.getElementById('enter-vr');
const coarse=()=>matchMedia('(pointer:coarse)').matches || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
let instance=null,vrSupported=false;
document.getElementById('readability').onclick=()=>{const active=document.body.classList.toggle('reading');const button=document.getElementById('readability');button.textContent=active?'VOLVER':'AMPLIAR';button.setAttribute('aria-pressed',String(active));const viewport=document.getElementById('game-viewport');viewport.scrollTo(0,0);};
// Unity consumes touch gestures globally; isolate reading-mode panning before they reach it.
let readingTouch=null;
for(const type of ['touchstart','touchmove','touchend','touchcancel']) window.addEventListener(type,event=>{
 if(!document.body.classList.contains('reading')||!document.getElementById('game-viewport').contains(event.target))return;
 event.stopImmediatePropagation();event.preventDefault();
 const touch=event.touches[0],viewport=document.getElementById('game-viewport');
 if(type==='touchmove'&&touch&&readingTouch)viewport.scrollBy(readingTouch.x-touch.clientX,readingTouch.y-touch.clientY);
 readingTouch=touch?{x:touch.clientX,y:touch.clientY}:null;
},{capture:true,passive:false});
window.toroGameReady=false;
window.onToroGameReady=()=>{if(!instance||!window.toroGameReady)return;document.getElementById('loading').style.display='none';document.body.classList.add('ready');send('SetTouchControlsFromBrowser',coarse()?'1':'0');detectVR();canvas.focus();};
const send=(method,arg='')=>{if(instance)instance.SendMessage('TORO · Game',method,arg);};
function pause(){send('OnBrowserHidden');}
function help(message){pause();document.getElementById('vr-message').textContent=message;document.getElementById('vr-help').style.display='flex';document.getElementById('vr-close').focus();}
const helpText='INICIO: JUGAR abre la campaña. como y para que? abre tres minijuegos sobre inscripciones, ingresos y programación de TORO. Arrastra módulos o dispara a pagos aprobados. VER CÓDIGO explica cada operación.\n\nCELULAR: usa la pantalla horizontal. AMPLIAR permite leer y deslizar; VOLVER recupera los controles.\n\nVR: apunta con el mando y pulsa el gatillo para seleccionar o disparar. Para arrastrar, mantén el gatillo y suelta sobre el destino.\n\nCAMPAÑA: construye tablas, conecta claves y prueba datos. Pide pistas, consulta PLANO / SQL y elige repetir o continuar al completar. CIRCUITOS está en el mapa.\n\nARCADE OPCIONAL: A/D cambia de carril, Espacio salta, J dispara, E activa pulso, Esc pausa.';
async function fullscreen(){if(!instance)return;try{if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else instance.SetFullscreen(1);if(coarse()&&screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape');}catch(e){}}
document.getElementById('fullscreen').onclick=fullscreen;document.getElementById('rotate-fullscreen').onclick=fullscreen;
document.getElementById('help').onclick=()=>help(helpText);
document.getElementById('vr-close').onclick=()=>{document.getElementById('vr-help').style.display='none';canvas.focus();};
function setVR(supported){vrSupported=Boolean(supported);vrButton.disabled=!instance;vrButton.textContent=vrSupported?'ENTRAR EN VR':'VR · INFO';}
async function detectVR(){try{setVR(Boolean(navigator.xr)&&await navigator.xr.isSessionSupported('immersive-vr'));}catch(e){setVR(false);}}
document.addEventListener('onVRSupportedCheck',event=>setVR(event.detail.supported));
vrButton.onclick=()=>{if(!vrSupported){help('Para jugar en realidad virtual abre este mismo enlace HTTPS en un navegador WebXR compatible, por ejemplo el navegador de Meta Quest, y conecta los mandos.\n\nEste navegador no detecta un visor VR disponible. Puedes jugar normalmente en PC o celular.');return;}const xr=instance&&instance.Module&&instance.Module.WebXR;if(!xr||!xr.toggleVR){help('El sistema VR aún no está listo. Espera unos segundos y vuelve a intentarlo.');return;}try{const result=xr.toggleVR();if(result&&result.catch)result.catch(()=>help('No se pudo iniciar VR. Revisa los permisos del visor e inténtalo de nuevo.'));}catch(e){help('No se pudo iniciar VR. Revisa los permisos del visor e inténtalo de nuevo.');}};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
window.addEventListener('resize',()=>{if(coarse()&&innerHeight>innerWidth)pause();});
const config={dataUrl:'Build/Web.data.unityweb',frameworkUrl:'Build/Web.framework.js.unityweb',codeUrl:'Build/Web.wasm.unityweb',streamingAssetsUrl:'StreamingAssets',companyName:'TORO Academy',productName:'TORO - Construye la academia',productVersion:'2.4.1',devicePixelRatio:Math.min(window.devicePixelRatio||1,3),showBanner:(msg,type)=>{if(type==='error'){status.textContent='No se pudo iniciar: '+msg;document.getElementById('loading').style.display='flex';}}};
for(const key of ['dataUrl','frameworkUrl','codeUrl'])config[key]+='?v='+config.productVersion;
const script=document.createElement('script');script.src='Build/Web.loader.js';
script.src+='?v='+config.productVersion;
script.onload=()=>createUnityInstance(canvas,config,p=>{document.getElementById('fill').style.width=(100*p)+'%';status.textContent='SINCRONIZANDO EL SISTEMA · '+Math.round(p*100)+'%';}).then(result=>{instance=result;window.toroUnity=result;status.textContent='ACTIVANDO CONTROLES…';window.onToroGameReady();}).catch(error=>{status.textContent='No se pudo iniciar TORO. Actualiza el navegador y vuelve a cargar la página. '+error;});
script.onerror=()=>{status.textContent='No se pudo descargar la compilación. Revisa la conexión y recarga la página.';};document.body.appendChild(script);
canvas.addEventListener('pointerdown',()=>canvas.focus());canvas.addEventListener('contextmenu',e=>e.preventDefault());
</script>
</body>
</html>
